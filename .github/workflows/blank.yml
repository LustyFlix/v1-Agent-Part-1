name: Extract Bolt Project to Root

on:
  push:
    branches: [ "main" ] # Triggers whenever you push to the main branch
  workflow_dispatch:      # Allows you to run this manually from the "Actions" tab

jobs:
  build-and-prep:
    runs-on: ubuntu-latest

    steps:
      # 1. Pulls your code (including the bolt.zip) into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Extract bolt.zip directly into the current directory (.)
      # -o: Overwrite existing files without prompting
      # -q: Quiet mode (prevents thousands of lines in your logs)
      - name: Extract bolt.zip to Root
        run: |
          if [ -f bolt.zip ]; then
            unzip -o bolt.zip -d .
            echo "Extraction complete."
            rm bolt.zip
            echo "Cleaned up zip file."
          else
            echo "bolt.zip not found. Skipping extraction."
            exit 1
          fi

      # 3. List the root directory to confirm files are where they should be
      - name: Verify Root Files
        run: ls -la
