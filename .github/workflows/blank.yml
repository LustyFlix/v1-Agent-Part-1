name: Extract Bolt Project

on:
  push:
    branches: [ "main" ]

jobs:
  unzip-project:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository content
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Unzip the file
      # -o overwrites existing files, -d specifies the destination directory
      - name: Extract bolt.zip
        run: |
          mkdir -p ./extracted-project
          unzip bolt.zip -d ./extracted-project

      # Step 3: Verify the extraction (Optional)
      - name: List extracted files
        run: ls -R ./extracted-project
