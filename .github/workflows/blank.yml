name: Extract Bolt Project

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  extract-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Debug Step: See exactly what the runner sees before unzipping
      - name: Check file existence
        run: |
          echo "Current directory: $(pwd)"
          ls -lh

      - name: Install Unzip (Fallback)
        run: sudo apt-get install -y unzip

      - name: Extract bolt.zip to Root
        run: |
          # Check if file exists, then unzip. 
          # We use -o to overwrite and -qq for extra quiet to avoid log bloat.
          if [ -f "bolt.zip" ]; then
            unzip -o bolt.zip -d .
            echo "Unzip successful."
          else
            echo "ERROR: bolt.zip not found in root!"
            exit 1
          fi

      # Move files if they are trapped in a subfolder
      # Run this ONLY if your zip contains one big folder
      - name: Move files out of subfolder (if applicable)
        run: |
          # This checks if there is only one folder and no files in root
          # If your zip had a folder named 'project', this moves everything out
          # Uncomment the lines below if your files are 'missing' after unzip
          # mv project/* . 2>/dev/null || true
          # rm -rf project || true

      - name: Final Cleanup and Verify
        run: |
          rm -f bolt.zip
          echo "Final file list:"
          ls -R
